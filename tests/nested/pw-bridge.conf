# A private PipeWire on top of the test JACK server (tests/nested/inner.sh, PB_PIPEWIRE=bridge):
# module-jack-tunnel makes the JACK bridge (jack_sink / jack_source driving the graph, the
# "PipeWire" JACK client), as JackBus with module-jackdbus-detect does. Metadata stand in
# for a session manager's: the default devices (the source chosen is a sink, as found on a real
# box) and a few WirePlumber settings with their schema.
context.properties = {
    core.daemon = true
    core.name = pipewire-0
    support.dbus = false
    mem.allow-mlock = false
    log.level = 2
}
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}
context.modules = [
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-spa-node-factory }
    { name = libpipewire-module-metadata }
    { name = libpipewire-module-access args = { } }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-link-factory }
    { name = libpipewire-module-jack-tunnel args = { tunnel.mode = duplex jack.connect = false } }
]
context.objects = [
    { factory = adapter
      args = { factory.name = support.null-audio-sink node.name = firefox node.description = "Firefox"
               media.class = Audio/Source/Virtual audio.position = [ FL FR ]
               adapter.auto-port-config = { mode = dsp monitor = true position = preserve } } }
    { factory = adapter
      args = { factory.name = support.null-audio-sink node.name = skype_in node.description = "Skype [Input]"
               media.class = Audio/Sink audio.position = [ FL FR ]
               adapter.auto-port-config = { mode = dsp monitor = true position = preserve } } }
    { factory = metadata
      args = { metadata.name = default
               metadata.values = [
                 { key = default.configured.audio.sink   type = "Spa:String:JSON" value = { name = jack_sink } }
                 { key = default.audio.sink              type = "Spa:String:JSON" value = { name = jack_sink } }
                 { key = default.configured.audio.source type = "Spa:String:JSON" value = { name = jack_sink } }
                 { key = default.audio.source            type = "Spa:String:JSON" value = { name = jack_source } }
               ] } }
    { factory = metadata
      args = { metadata.name = schema-sm-settings
               metadata.values = [
                 { key = device.restore-profile type = "Spa:String:JSON"
                   value = { name = "Restore profile" description = "Remember and restore device profiles" type = bool default = true } }
                 { key = linking.role-based.duck-level type = "Spa:String:JSON"
                   value = { name = "Ducking level" description = "The volume level to apply when ducking" type = float default = 0.3 min = 0.0 max = 1.0 } }
                 { key = monitor.camera-discovery-timeout type = "Spa:String:JSON"
                   value = { name = "Discovery timeout" description = "The camera discovery timeout in milliseconds" type = int default = 1000 min = 0 max = 60000 } }
                 { key = bluetooth.profile-preference type = "Spa:String:JSON"
                   value = { name = "Bluetooth profile preference" description = "Prefer better quality or better latency" type = string default = "quality" } }
               ] } }
    { factory = metadata
      args = { metadata.name = sm-settings
               metadata.values = [
                 { key = device.restore-profile type = "Spa:String:JSON" value = true }
                 { key = linking.role-based.duck-level type = "Spa:String:JSON" value = 0.3 }
                 { key = monitor.camera-discovery-timeout type = "Spa:String:JSON" value = 1000 }
                 { key = bluetooth.profile-preference type = "Spa:String:JSON" value = "quality" }
               ] } }
]
