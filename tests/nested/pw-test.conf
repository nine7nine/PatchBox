# A private PipeWire for tests (tests/nested/inner.sh, PB_PIPEWIRE=1): no session manager, no
# devices, no D-Bus; a dummy driver and null sinks/sources standing in for the JACK bridge, a
# device and two application streams.
context.properties = {
    core.daemon = true
    core.name = pipewire-0
    support.dbus = false
    mem.allow-mlock = false
    log.level = 2
}
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}
context.modules = [
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-spa-node-factory }
    { name = libpipewire-module-metadata }
    { name = libpipewire-module-access args = { } }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-link-factory }
]
context.objects = [
    { factory = spa-node-factory
      args = { factory.name = support.node.driver node.name = Dummy-Driver node.group = pipewire.dummy priority.driver = 20000 } }
    { factory = adapter
      args = { factory.name = support.null-audio-sink node.name = jack_sink node.description = "JACK Sink"
               media.class = Audio/Sink audio.position = [ FL FR ] node.group = pipewire.dummy
               adapter.auto-port-config = { mode = dsp monitor = true position = preserve } } }
    { factory = adapter
      args = { factory.name = support.null-audio-sink node.name = jack_source node.description = "JACK Source"
               media.class = Audio/Source/Virtual audio.position = [ FL FR ] node.group = pipewire.dummy
               adapter.auto-port-config = { mode = dsp monitor = true position = preserve } } }
    { factory = adapter
      args = { factory.name = support.null-audio-sink node.name = firefox node.description = "Firefox"
               media.class = Audio/Source/Virtual audio.position = [ FL FR ] node.group = pipewire.dummy
               adapter.auto-port-config = { mode = dsp monitor = true position = preserve } } }
    { factory = adapter
      args = { factory.name = support.null-audio-sink node.name = skype_in node.description = "Skype [Input]"
               media.class = Audio/Sink audio.position = [ FL FR ] node.group = pipewire.dummy
               adapter.auto-port-config = { mode = dsp monitor = true position = preserve } } }
]
